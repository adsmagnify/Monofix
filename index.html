<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MONOFIX</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" aria-roledescription="carousel" aria-label="MONOFIX slides">
      <div class="stage__glow" aria-hidden="true"></div>

      <div class="viewport" id="viewport">
        <a class="brand" href="#home" aria-label="MONOFIX Packaging Solutions">
          <img src="logo.png" alt="MONOFIX Packaging Solutions" />
        </a>
        <div class="deck" id="deck">
          <figure class="slide is-active" data-index="0">
            <img
              src="unboxing-soon.jpg"
              alt="MONOFIX unboxing soon — sustainable packaging"
              draggable="false"
            />
            <div class="slide__wash" aria-hidden="true"></div>
          </figure>
          <figure class="slide" data-index="1">
            <img
              src="MONOFIX-GCC-Collaborations.jpg"
              alt="MONOFIX GCC collaborations — services and expertise"
              draggable="false"
            />
            <div class="slide__wash" aria-hidden="true"></div>
          </figure>
        </div>
        <div class="film" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <button type="button" class="dot is-active" data-go="0" aria-label="Show unboxing slide" aria-current="true"></button>
        <button type="button" class="dot" data-go="1" aria-label="Show collaborations slide"></button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
